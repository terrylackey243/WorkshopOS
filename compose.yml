services:
  postgres:
    image: postgres:16-bookworm
    container_name: workshopos-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - workshopos-postgres-data:/var/lib/postgresql/data
    networks:
      - workshopos
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshopos} -d ${POSTGRES_DB:-workshopos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-bookworm
    container_name: workshopos-redis
    restart: unless-stopped
    volumes:
      - workshopos-redis-data:/data
    networks:
      - workshopos
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: workshopos-migrate
    restart: "no"
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workshopos
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: workshopos-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - workshopos-generated-data:/data/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - workshopos
      - apps
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: workshopos-worker
    restart: unless-stopped
    command: dramatiq app.workers.tasks
    env_file:
      - .env
    volumes:
      - workshopos-generated-data:/data/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - workshopos
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    container_name: workshopos-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3027}:3027"
    networks:
      - workshopos
      - apps
      - web
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3027/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  workshopos-postgres-data:
  workshopos-redis-data:
  workshopos-generated-data:

networks:
  workshopos:
    name: workshopos-net

  apps:
    external: true

  web:
    external: true
    name: ${CADDY_NETWORK_NAME:-web}
