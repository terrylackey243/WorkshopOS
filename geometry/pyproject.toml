[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="workshop-geometry"
version="0.5.0"
requires-python=">=3.12"
dependencies=["manifold3d>=3.0,<4","mapbox-earcut>=1.0,<2","matplotlib>=3.9,<4","numpy>=2.1,<3","qrcode>=7.4,<8","shapely>=2.0,<3","trimesh>=4.5,<5"]

[project.optional-dependencies]
# Test-only, not part of the runtime image -- a real QR decoder to verify
# _qr_geometry actually produces a scannable pattern (not just "some
# geometry was produced"), see test_label_engine.py::test_qr_body_decodes.
# zxing-cpp ships a self-contained wheel (no libzbar system dependency,
# unlike pyzbar -- confirmed via a spike before choosing this).
test=["zxing-cpp>=2.2,<3","pillow>=10,<12","rtree>=1.0,<2"]
[tool.hatch.build.targets.wheel]
packages=["src/workshop_geometry"]
[tool.pytest.ini_options]
testpaths=["tests"]
