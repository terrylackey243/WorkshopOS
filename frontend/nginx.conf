server {
  listen 3027;
  server_name _;
  client_max_body_size 150m;

  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://workshopos-api:8000;

  location = /health {
    proxy_pass $api_upstream/health;
  }

  location /api/ {
    # FastAPI routers have no /api prefix (e.g. /auth/login, not
    # /api/auth/login) -- strip it here. `rewrite ... break` combined with a
    # variable proxy_pass keeps the lazy-DNS-resolution behavior (the api
    # container doesn't need to exist yet when nginx starts) while still
    # stripping the prefix, since a literal `proxy_pass $api_upstream/;`
    # would resolve $api_upstream at request time but NOT strip the /api/
    # location match the way a non-variable proxy_pass with a trailing
    # slash would.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
